name: EGX & Market Rates Auto-Sync to Google Sheets

on:
  repository_dispatch:
    types: [cron_sync]   # لازم يطابق event_type في cron-job.org
  schedule:
    # Runs during EGX market hours (10:00 AM to 2:45 PM Cairo Time = 07:00 to 11:45 UTC, Sunday-Thursday)
    - cron: '*/15 7-11 * * 0-4'
    # Final 11:00 PM Cairo Time Closing Snapshot (20:00 UTC, Sunday-Thursday)
    - cron: '0 20 * * 0-4'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

concurrency:
  group: egx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright curl_cffi lxml requests
          playwright install chromium --with-deps

      - name: Run Cloud Sync
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          python cloud_sync.py

      - name: Commit & Push Updated Archive Database and Data Payloads
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): auto-persist archive database and market cache [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
