name: EGX & Market Rates Auto-Sync to Google Sheets

on:
  repository_dispatch:
    types: [cron_sync]   # لازم يطابق event_type في cron-job.org
  schedule:
    # Runs every 15 minutes during EGX market hours (10:00 AM to 2:45 PM Cairo Time, Sunday-Thursday)
    - cron: '*/15 7-12 * * 0-4'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: egx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright curl_cffi lxml requests
          playwright install chromium --with-deps

      - name: Run Cloud Sync
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          python cloud_sync.py
